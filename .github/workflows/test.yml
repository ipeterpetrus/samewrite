name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: guard suite
        run: python3 tests/test_write_noop_guard.py
      - name: profile discovery suite
        run: python3 tests/test_profiles.py
      - name: plugin + marketplace manifests
        run: python3 tests/test_plugin_manifest.py
      - name: carry suite
        run: python3 tests/test_carry.py
      - name: skills suite
        run: python3 tests/test_skills.py
      - name: health suite
        run: python3 tests/test_health.py
      - name: README assertion count matches reality
        # README menyebut satu angka; angka itu pernah basi (124 vs 160 nyata, 13-Sep).
        # Klaim yang tak ada penegaknya membusuk diam-diam — di repo yang seluruh isinya
        # klaim terukur, itu kelas kesalahan yang paling mahal.
        run: |
          python3 - <<'EOF'
          import glob, re, subprocess, sys
          total = 0
          for f in sorted(glob.glob("tests/test_*.py")):
              out = subprocess.run([sys.executable, f], capture_output=True, text=True).stdout
              m = re.search(r"(\d+) PASS", out)
              assert m, f"{f}: tak mencetak hitungan PASS"
              total += int(m.group(1))
          claim = re.search(r"(\d+) assertions in six suites", open("README.md").read())
          assert claim, "README tak lagi menyebut jumlah assertion — perbarui uji ini"
          assert int(claim.group(1)) == total, \
              f"README bilang {claim.group(1)} assertion, suite menjalankan {total}"
          print(f"README cocok: {total} assertion")
          EOF
      - name: end-to-end on synthetic fixture
        run: |
          python3 tools/make_fixture.py /tmp/fx.jsonl --seed 7 --turns 400
          python3 tools/extract.py /tmp/fx.pkl /tmp/fx.jsonl
          python3 tools/simulate.py /tmp/fx.pkl
          python3 tools/carry.py /tmp/fx.jsonl --min-turns 1 --markdown
      - name: redaction holds
        run: |
          python3 - <<'EOF'
          import pickle
          d = pickle.load(open("/tmp/fx.pkl", "rb"))
          blob = pickle.dumps(d)
          for probe in (b"def f", b"# ubah", b"/w/mod"):
              assert probe not in blob, f"isi berkas bocor ke keluaran: {probe!r}"
          print("redaksi terverifikasi: nol isi berkas di keluaran")
          EOF
