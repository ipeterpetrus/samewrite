name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # laporkan KEDUA versi Python, jangan batalkan satu karena yang lain gagal
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: test dependency (pytest is NOT preinstalled on the runner — CI 14-Sep failed on exactly this)
        run: |
          python -m pip install --quiet -r requirements-test.txt
          python -m pytest --version
      - name: guard suite
        run: python3 tests/test_write_noop_guard.py
      - name: profile discovery suite
        run: python3 tests/test_profiles.py
      - name: plugin + marketplace manifests
        run: python3 tests/test_plugin_manifest.py
      - name: carry suite
        run: python3 tests/test_carry.py
      - name: multi-block transcript accounting (one message, however many records carry it)
        # Public issue #1: one JSONL record per content block, each repeating message.id and
        # message.usage. Every fixture that existed before this suite emitted one record per
        # message with no id — the one shape the defect cannot touch.
        run: python3 tests/test_multiblock.py
      - name: skills suite
        run: python3 tests/test_skills.py
      - name: health suite
        run: python3 tests/test_health.py
      - name: adapters drift + command surface + version pins
        run: python3 tests/test_adapters.py
      - name: install commands still describe this repository (paths, pins, archive shape)
        run: python3 tests/test_install_paths.py
      - name: the published OpenClaw one-liner cleans up on every outcome
        # Offline: a local file:// tarball and a stub host. An install command that litters /tmp on
        # failure is the kind of bug that only ever shows up on someone else's machine.
        run: bash tests/test_oneliner_cleanup.sh
      - name: coexistence matrix (Ponytail / i-have-adhd / Caveman surfaces)
        run: python3 tests/test_coexist.py
      - name: v1.4 evidence boundary — frozen vectors replayed against the production decoders
        run: python3 tests/test_evidence_boundary.py
      - name: v1.4 phase 2 — typed acquisition, legacy fail-closed, privacy, optimizer isolation
        run: python3 tests/test_evidence_phase2.py
      - name: offline optimizer (privacy canary, corruption, zero policy mutation)
        run: python3 tests/test_optimize.py
      - name: legacy evidence integrity - the frozen v1.4.2 counterexample matrix
        # Ambiguous, incomplete, invalid, non-comparable or host-shifted evidence must not produce
        # a candidate specification unless the bounded-evidence exception was explicitly asked for.
        run: python3 tests/test_evidence_integrity.py
      - name: the 1.4.0 release ships shadow evaluation and nothing that writes
        # Sebuah rilis paling mudah "menyalakan" sesuatu tanpa sengaja saat versinya dinaikkan.
        # Suite ini yang membuat kalimat "promotion/persistence tidak aktif" bisa diperiksa.
        run: python3 tests/test_release_shadow_only.py
      - name: multi-agent suite (scope isolation, 64 concurrent writers, crash, reentrancy, clock skew)
        run: python3 tests/test_multiagent.py
      - name: mutation suite (every AI-VOS invariant must go RED when its implementation is broken)
        run: python3 tests/test_mutation.py
      - name: fixtures + oracles for the AI-VOS role matrix are well formed
        run: python3 experiments/aivos/fixtures_aivos.py
      - name: long-run observer (evidence ladder + a scheduler that must go quiet; no model needed)
        run: python3 experiments/aivos/longrun.py --days 20 --cycles 5 --plateau 8
      - name: sweep scaling harness (small size in CI; the 1k/10k numbers are in docs/MULTI_AGENT.md)
        run: python3 experiments/scale/scan_scale.py --sizes 200
      - name: benchmark instruments self-test (GOOD -> GREEN, BAD -> RED, no model calls)
        run: python3 experiments/vnext/selftest.py
      - name: presentation instruments self-test (prose classifiers + per-case contracts)
        run: python3 experiments/presentation/selftest_pres.py
      - name: README assertion count matches reality
        # README menyebut satu angka; angka itu pernah basi (124 vs 160 nyata, 13-Sep).
        # Klaim yang tak ada penegaknya membusuk diam-diam — di repo yang seluruh isinya
        # klaim terukur, itu kelas kesalahan yang paling mahal.
        run: |
          python3 - <<'EOF'
          import glob, re, subprocess, sys
          total = 0
          for f in sorted(glob.glob("tests/test_*.py")):
              out = subprocess.run([sys.executable, f], capture_output=True, text=True).stdout
              m = re.search(r"(\d+) PASS", out)
              assert m, f"{f}: tak mencetak hitungan PASS"
              total += int(m.group(1))
          claim = re.search(r"(\d+) assertions in \w+ suites", open("README.md").read())
          assert claim, "README tak lagi menyebut jumlah assertion — perbarui uji ini"
          assert int(claim.group(1)) == total, \
              f"README bilang {claim.group(1)} assertion, suite menjalankan {total}"
          print(f"README cocok: {total} assertion")
          EOF
      - name: end-to-end on synthetic fixture
        run: |
          python3 tools/make_fixture.py /tmp/fx.jsonl --seed 7 --turns 400
          python3 tools/extract.py /tmp/fx.pkl /tmp/fx.jsonl
          python3 tools/simulate.py /tmp/fx.pkl
          python3 tools/carry.py /tmp/fx.jsonl --min-turns 1 --markdown
      - name: redaction holds
        run: |
          python3 - <<'EOF'
          import pickle
          d = pickle.load(open("/tmp/fx.pkl", "rb"))
          blob = pickle.dumps(d)
          for probe in (b"def f", b"# ubah", b"/w/mod"):
              assert probe not in blob, f"isi berkas bocor ke keluaran: {probe!r}"
          print("redaksi terverifikasi: nol isi berkas di keluaran")
          EOF
